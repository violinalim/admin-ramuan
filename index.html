<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Magic Cauldron</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#08040b}
body{font-family:Arial,Helvetica,sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit}

.scene{
  --stream-left:50%;
  --stream-bottom:303px;
  --stream-rotate:4deg;
  position:relative;width:100vw;height:100vh;min-height:100svh;overflow:hidden;
  background:#09050d url("https://plcl.me/images/ohwiK.png") center center/cover no-repeat;
  user-select:none;-webkit-user-select:none;isolation:isolate;
}
.scene::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 0%,transparent 58%,rgba(0,0,0,.18) 100%);
  pointer-events:none;z-index:1;
}

.stage{
  position:absolute;left:50%;bottom:1.5%;width:920px;height:720px;
  transform:translateX(-50%);transform-origin:center bottom;z-index:10;
}

.cauldron-zone{
  position:absolute;left:50%;bottom:22px;width:410px;height:410px;
  transform:translateX(-50%);z-index:30;
}
.cauldron-shadow{
  position:absolute;left:50%;bottom:4px;width:310px;height:48px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.75) 0%,rgba(0,0,0,.35) 48%,transparent 76%);
  filter:blur(10px);z-index:1;
}
.cauldron-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;z-index:20;
  pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 22px 22px rgba(0,0,0,.38));
}

/* opening zone */
.liquid-mask{
  position:absolute;left:50%;top:15.9%;width:66.5%;height:12.4%;transform:translateX(-50%);
  border-radius:50%;overflow:hidden;pointer-events:none;z-index:24;
}
.liquid-surface{
  position:absolute;inset:-18% -10%;
  background:
    radial-gradient(ellipse at 50% 48%, rgba(255,255,255,.22) 0%, rgba(255,255,255,.08) 16%, rgba(255,255,255,0) 38%),
    radial-gradient(ellipse at 35% 50%, rgba(255,170,255,.24) 0%, rgba(255,170,255,0) 36%),
    radial-gradient(ellipse at 72% 55%, rgba(130,205,255,.18) 0%, rgba(130,205,255,0) 34%),
    linear-gradient(180deg, rgba(255,170,255,.18), rgba(175,67,255,.48) 40%, rgba(93,18,153,.88) 100%);
  opacity:.96;
  animation:liquidMove 3.6s ease-in-out infinite;
}
.liquid-surface::before{
  content:"";position:absolute;inset:-8% -12%;
  background:
    repeating-radial-gradient(ellipse at 50% 55%, rgba(255,255,255,.11) 0 4px, rgba(255,255,255,0) 4px 18px),
    repeating-linear-gradient(96deg, rgba(255,255,255,.08) 0 2px, rgba(255,255,255,0) 2px 16px);
  opacity:.65;
  mix-blend-mode:screen;
  animation:liquidRipple 2.4s linear infinite;
}
.liquid-surface::after{
  content:"";position:absolute;left:-8%;right:-8%;top:16%;height:34%;
  background:linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0));
  border-radius:50%;filter:blur(4px);opacity:.7;
  animation:liquidShine 2.8s ease-in-out infinite;
}
.liquid-glow{
  position:absolute;left:50%;top:15.2%;width:72%;height:15%;transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(230,120,255,.30) 0%, rgba(175,56,255,.18) 45%, transparent 75%);
  filter:blur(10px);pointer-events:none;z-index:23;animation:glowPulse 2.2s ease-in-out infinite alternate;
}
@keyframes liquidMove{
  0%{transform:translateX(-2.5%) translateY(1%) scale(1.02)}
  25%{transform:translateX(1.5%) translateY(-1.5%) scale(1.05)}
  50%{transform:translateX(3%) translateY(.5%) scale(1.06)}
  75%{transform:translateX(-1%) translateY(-1%) scale(1.04)}
  100%{transform:translateX(-2.5%) translateY(1%) scale(1.02)}
}
@keyframes liquidRipple{
  0%{transform:translateX(-2%) scale(1);opacity:.42}
  50%{transform:translateX(2%) scale(1.04);opacity:.74}
  100%{transform:translateX(-2%) scale(1);opacity:.42}
}
@keyframes liquidShine{
  0%,100%{transform:translateX(-8%) scaleX(.96);opacity:.45}
  50%{transform:translateX(8%) scaleX(1.04);opacity:.88}
}
@keyframes glowPulse{from{opacity:.42;transform:translateX(-50%) scale(.985)}to{opacity:.85;transform:translateX(-50%) scale(1.04)}}

/* Bubbles & smoke aligned to red rectangle */
#bubbles{
  position:absolute;left:50%;top:-2%;width:66%;height:20%;transform:translateX(-50%);
  pointer-events:none;overflow:visible;z-index:40;
}
#smoke{
  position:absolute;
  left:50%;
  top:-12%;
  width:112%;
  height:46%;
  transform:translateX(-50%);
  pointer-events:none;
  overflow:visible;
  z-index:42;
}
.magic-ring{
  position:absolute;left:50%;top:15.7%;width:66%;height:11%;transform:translateX(-50%) scale(.96);
  border-radius:50%;border:2px solid rgba(244,191,255,.22);
  box-shadow:0 0 18px rgba(204,84,255,.18), inset 0 0 14px rgba(221,132,255,.10);
  opacity:.34;z-index:35;pointer-events:none;animation:ringIdle 1.8s ease-in-out infinite alternate;
}
@keyframes ringIdle{to{opacity:.56;transform:translateX(-50%) scale(1.02)}}
.flash{
  position:absolute;left:50%;top:5%;width:72%;height:24%;transform:translateX(-50%) scale(.25);
  border-radius:50%;background:radial-gradient(ellipse,var(--glow,rgba(215,108,255,.68)),rgba(178,57,255,.22) 42%,transparent 74%);
  filter:blur(8px);opacity:0;z-index:38;pointer-events:none;
}
.flash.show{animation:flash .9s ease-out both}
@keyframes flash{0%{opacity:0;transform:translateX(-50%) scale(.25)}35%{opacity:1;transform:translateX(-50%) scale(1.05)}100%{opacity:0;transform:translateX(-50%) scale(1.55)}}

.bubble{
  position:absolute;bottom:12%;border-radius:50%;
  background:radial-gradient(circle at 28% 23%,rgba(255,255,255,.94) 0%,rgba(238,171,255,.70) 13%,rgba(194,75,255,.46) 42%,rgba(108,8,168,.55) 78%);
  border:1px solid rgba(244,197,255,.66);box-shadow:0 0 10px rgba(190,71,255,.30);
  animation:bubbleRise var(--duration) ease-out forwards;
}
@keyframes bubbleRise{
  0%{opacity:0;transform:translate(0,4px) scale(.24)}
  15%{opacity:1}
  58%{opacity:.95;transform:translate(var(--drift1),-24px) scale(.92)}
  100%{opacity:0;transform:translate(var(--drift2),-68px) scale(1.35)}
}

.smoke-particle{
  position:absolute;
  bottom:-2%;
  width:var(--size);
  height:calc(var(--size) * 1.5);
  border-radius:50%;
  background:
    radial-gradient(
      ellipse at 50% 55%,
      rgba(238,178,255,.74) 0%,
      rgba(208,108,255,.58) 18%,
      rgba(164,55,235,.40) 42%,
      rgba(102,24,158,.20) 68%,
      transparent 100%
    );
  filter:blur(var(--blur));
  opacity:0;
  animation:smokeRise var(--duration) cubic-bezier(.18,.45,.38,1) forwards;
}
@keyframes smokeRise{
  0%{
    opacity:0;
    transform:translate(-50%,10px) scale(.34);
  }
  10%{
    opacity:var(--opacity);
  }
  38%{
    opacity:var(--opacity-mid);
    transform:translate(calc(-50% + var(--drift1)),-52px) scale(1.02);
  }
  70%{
    opacity:var(--opacity-low);
    transform:translate(calc(-50% + var(--drift2)),-110px) scale(1.55);
  }
  100%{
    opacity:0;
    transform:translate(calc(-50% + var(--drift3)),var(--rise)) scale(var(--scale));
  }
}

.bottles{
  position:absolute;right:-55px;bottom:0;width:430px;height:610px;z-index:120;
}
.bottle{
  position:absolute;width:145px;height:176px;border:0;background:transparent;cursor:pointer;outline:none;
  transform-origin:50% 82%;animation:bottleFloat 3.1s ease-in-out infinite;z-index:125;
  --pour-x:0px;--pour-y:60px;
}
.bottle.purple{left:165px;bottom:360px;--pour-x:-148px;--pour-y:-54px}
.bottle.green{left:250px;bottom:332px;--pour-x:-224px;--pour-y:-34px;animation-delay:.42s}
.bottle.blue{left:335px;bottom:360px;--pour-x:-300px;--pour-y:-54px;animation-delay:.84s}

.pour-mouth{
  position:absolute;
  left:50%;
  top:43px;
  width:2px;
  height:2px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:0;
  z-index:200;
}

.pour-target{
  position:absolute;
  left:50%;
  top:18.8%;
  width:2px;
  height:2px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:0;
  z-index:200;
}

.bottle:hover,.bottle:focus-visible{filter:brightness(1.10) drop-shadow(0 0 16px rgba(206,94,255,.40))}
.bottle img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;
  pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 12px 11px rgba(0,0,0,.20));transition:opacity .16s ease;
}
.bottle .open{opacity:0}
.bottle.active .closed{opacity:0}
.bottle.active .open{opacity:1}
.bottle.active{
  z-index:175;pointer-events:none;animation:bottlePour 2.7s cubic-bezier(.4,0,.2,1) both;
  filter:brightness(1.12) drop-shadow(0 0 18px var(--glow,rgba(205,85,255,.65)));
}
@keyframes bottleFloat{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes bottlePour{
  0%{transform:translate(0,0) rotate(0deg)}
  14%{transform:translate(-6px,-26px) rotate(-8deg)}
  38%{transform:translate(calc(var(--pour-x) * .55),18px) rotate(-30deg)}
  50%,72%{transform:translate(var(--pour-x),var(--pour-y)) rotate(-72deg)}
  82%{transform:translate(calc(var(--pour-x) * .35),12px) rotate(-24deg)}
  100%{transform:translate(0,0) rotate(0deg)}
}


.pour-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
  z-index:115;
  opacity:0;
}
.pour-svg.show{
  opacity:1;
}
.pour-glow{
  fill:none;
  stroke:var(--glow,#d76cff);
  stroke-width:14;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.11;
  filter:blur(3.2px);
}
.pour-main{
  fill:none;
  stroke:url(#potionGradient);
  stroke-width:8.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 4px var(--glow,#d76cff));
  opacity:.94;
}
.pour-highlight{
  display:block;
  fill:none;
  stroke:rgba(255,255,255,.38);
  stroke-width:2.1;
  stroke-linecap:round;
  opacity:.58;
  pointer-events:none;
}
.pour-splash{
  fill:var(--c2,#cf55ff);
  opacity:0;
  transform-box:fill-box;
  transform-origin:center;
}
.pour-svg.show .pour-main{
  animation:streamNatural .24s ease-in-out infinite alternate;
}
.pour-svg.show .pour-highlight{
  animation:streamHighlight .30s ease-in-out infinite alternate;
}
.pour-svg.show .pour-splash{
  animation:splashReal .30s ease-in-out infinite alternate;
}
@keyframes streamNatural{
  from{stroke-width:8.1;opacity:.90}
  to{stroke-width:9.0;opacity:.98}
}
@keyframes streamHighlight{
  from{opacity:.34}
  to{opacity:.64}
}
@keyframes splashReal{
  from{opacity:.16;transform:scale(.76,.56)}
  to{opacity:.46;transform:scale(1.00,.72)}
}

@media (min-width: 1200px){
  .stage{width:920px;height:720px}
}
@media(max-width:980px){
  .stage{transform:translateX(-50%) scale(.88)}
  .bottles{right:-40px}
}
@media(max-width:760px){
  .stage{bottom:.5%;width:820px;height:680px;transform:translateX(-50%) scale(.70)}
  .bottles{right:-26px}
}
@media(max-width:540px){
  .scene{background-position:center center}
  .stage{bottom:1.5%;width:720px;height:650px;transform:translateX(-50%) scale(.54)}
  .cauldron-zone{bottom:38px}
  .bottles{right:-18px}
}
@media(max-width:420px){
  .stage{bottom:3%;width:670px;height:620px;transform:translateX(-50%) scale(.48)}
  .cauldron-zone{bottom:58px}
  .bottles{right:-12px}
}
@media(max-height:620px) and (orientation:landscape){
  .stage{bottom:-3%;transform:translateX(-50%) scale(.68)}
}

.reveal-puff{
  position:absolute;
  left:50%;
  bottom:18px;
  width:var(--size);
  height:calc(var(--size) * .78);
  border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 55%,rgba(247,220,255,.68) 0%,rgba(214,131,255,.48) 18%,rgba(155,62,217,.24) 48%,rgba(105,34,150,.10) 70%,transparent 100%);
  filter:blur(var(--blur));
  opacity:0;
  transform:translate(-50%,0) scale(.3);
}
.result-layer.show .reveal-puff{
  animation:rewardSmoke var(--dur) cubic-bezier(.18,.42,.22,1) forwards;
}
@keyframes rewardSmoke{
  0%{opacity:0;transform:translate(calc(-50% + var(--drift1)),12px) scale(.28)}
  14%{opacity:var(--o)}
  46%{opacity:var(--o2);transform:translate(calc(-50% + var(--drift2)),-44px) scale(1.02)}
  74%{opacity:var(--o3);transform:translate(calc(-50% + var(--drift3)),-98px) scale(1.42)}
  100%{opacity:0;transform:translate(calc(-50% + var(--drift4)),var(--rise)) scale(var(--scale))}
}
.prize-emerge{
  position:absolute;left:50%;bottom:20px;transform:translate(-50%,28px) scale(.74);
  opacity:0;filter:blur(10px);z-index:3;text-align:center;min-width:min(320px,80vw)
}
.result-layer.show .prize-emerge{
  animation:prizeEmerge .92s cubic-bezier(.18,.7,.18,1) .54s forwards;
}
@keyframes prizeEmerge{
  0%{opacity:0;transform:translate(-50%,30px) scale(.72);filter:blur(10px)}
  45%{opacity:.76;transform:translate(-50%,10px) scale(.92);filter:blur(5px)}
  100%{opacity:1;transform:translate(-50%,0) scale(1);filter:blur(0)}
}
.prize-badge{
  width:96px;height:96px;margin:0 auto 12px;border-radius:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:48px;color:#fff;
  background:
    radial-gradient(circle at 35% 25%,rgba(255,255,255,.40),rgba(255,255,255,0) 34%),
    linear-gradient(180deg,#ca67ff,#7d2bc0 62%,#451369 100%);
  box-shadow:0 0 34px rgba(200,102,255,.34),inset 0 0 18px rgba(255,255,255,.20);
  border:1px solid rgba(255,255,255,.20);
}
.prize-reveal-name{
  font-size:26px;font-weight:900;letter-spacing:.4px;color:#f5dcff;
  text-shadow:0 0 18px rgba(201,114,255,.34)
}
.prize-reveal-value{
  margin-top:8px;font-size:14px;color:#e7d6ef
}
.result-icon{display:none}
.result-kicker{margin-top:0;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#bfaacc}
.result-name{font-size:24px;font-weight:900;margin-top:4px;color:#f0d6ff}
.result-value{font-size:14px;margin-top:8px;color:#fff}
.result-remaining{margin-top:15px;font-size:12px;color:#baa7c5}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.ui-card{
  width:min(440px,94vw);
  border:1px solid rgba(213,151,255,.25);
  border-radius:24px;padding:26px;
  background:linear-gradient(180deg,rgba(24,10,34,.88),rgba(12,5,19,.92));
  box-shadow:0 28px 70px rgba(0,0,0,.62),0 0 42px rgba(170,67,255,.13);
  backdrop-filter:blur(8px);
  color:#fff;
}
.ui-logo{
  width:74px;height:74px;margin:0 auto 12px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:38px;
  background:radial-gradient(circle at 35% 25%,#d898ff,#7b20bd 55%,#321045);
  box-shadow:0 0 28px rgba(195,90,255,.30);
}
.ui-title{text-align:center;font-size:26px;font-weight:900;letter-spacing:.6px}
.ui-sub{text-align:center;margin-top:7px;color:#cbb9d6;font-size:13px;line-height:1.5}
.ui-form{display:grid;gap:13px;margin-top:22px}
.ui-field label{display:block;margin:0 0 7px 2px;color:#d8c8e2;font-size:12px;font-weight:700}
.ui-input{
  width:100%;height:48px;border-radius:13px;border:1px solid rgba(213,163,255,.18);
  background:#0c0711;color:#fff;padding:0 14px;outline:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.015);
}
.ui-input:focus{border-color:rgba(203,105,255,.7);box-shadow:0 0 0 3px rgba(178,66,255,.11)}
.ui-btn{
  min-height:48px;border:0;border-radius:13px;padding:0 16px;cursor:pointer;
  font-weight:900;letter-spacing:.3px;color:#fff;
  background:linear-gradient(135deg,#9e3be9,#5e1b92);
  box-shadow:0 10px 24px rgba(119,36,170,.27);
}
.ui-btn:hover{filter:brightness(1.08)}
.ui-btn.secondary{background:#1b1122;border:1px solid rgba(213,163,255,.16);box-shadow:none}
.ui-error{min-height:18px;margin-top:10px;color:#ff9aa8;text-align:center;font-size:12px}
.home-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;
}
.stat-box{
  padding:14px;border-radius:16px;text-align:center;
  background:rgba(132,50,183,.10);border:1px solid rgba(219,166,255,.14)
}
.stat-label{font-size:11px;color:#bca9c7;text-transform:uppercase;letter-spacing:.7px}
.stat-value{font-size:22px;font-weight:900;margin-top:5px}
.home-actions{display:grid;gap:10px}
.game-hud{
  position:fixed;left:12px;right:12px;top:12px;z-index:9000;
  display:none;align-items:center;justify-content:space-between;gap:10px;
  pointer-events:none;
}
.hud-box{
  pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:42px;
  padding:8px 12px;border-radius:14px;color:#fff;
  background:rgba(10,5,14,.72);border:1px solid rgba(220,173,255,.18);
  backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.22)
}
.hud-id{font-size:12px;color:#cfbdd9}.hud-id b{color:#fff}
.hud-chance{font-size:12px}.hud-chance b{font-size:16px;color:#e9bcff}
.hud-actions{display:flex;gap:7px}
.hud-btn{
  pointer-events:auto;border:1px solid rgba(224,180,255,.18);background:rgba(25,11,34,.78);
  color:#fff;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer
}
.result-icon{font-size:52px;filter:drop-shadow(0 0 16px rgba(205,88,255,.38))}
.result-kicker{margin-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#bfaacc}
.result-name{font-size:28px;font-weight:900;margin-top:9px;color:#f0d6ff}
.result-value{font-size:15px;margin-top:8px;color:#fff}
.result-remaining{margin-top:15px;font-size:12px;color:#baa7c5}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
@media(max-width:520px){
  .ui-card{padding:21px 17px;border-radius:20px}
  .ui-title{font-size:23px}
  .game-hud{top:8px;left:8px;right:8px}
  .hud-box{padding:7px 9px;gap:7px}
  .hud-actions{gap:5px}
  .hud-btn{padding:7px 8px}
  .result-actions{grid-template-columns:1fr}
}

</style>
</head>
<body>

<div class="auth-layer" id="authLayer">
  <div class="ui-card">
    <div class="ui-logo">🔮</div>
    <div class="ui-title">MAGIC CAULDRON</div>
    <div class="ui-sub">Masuk menggunakan ID dan password yang diberikan admin. Data tersimpan online di Google Sheet.</div>
    <form class="ui-form" id="memberLoginForm" autocomplete="off">
      <div class="ui-field">
        <label>USER ID</label>
        <input class="ui-input" id="loginUserId" type="text" placeholder="Masukkan User ID" maxlength="40" required>
      </div>
      <div class="ui-field">
        <label>PASSWORD</label>
        <input class="ui-input" id="loginPassword" type="password" placeholder="Masukkan Password" maxlength="80" required>
      </div>
      <button class="ui-btn" type="submit">LOGIN</button>
    </form>
    <div class="ui-error" id="loginError"></div>
  </div>
</div>

<div class="home-layer" id="homeLayer">
  <div class="ui-card">
    <div class="ui-logo">🧪</div>
    <div class="ui-title">SIAP MERACIK?</div>
    <div class="ui-sub">Pilih salah satu ramuan saat permainan dimulai.</div>
    <div class="home-stats">
      <div class="stat-box">
        <div class="stat-label">Member</div>
        <div class="stat-value" id="homeMemberId">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Kesempatan</div>
        <div class="stat-value" id="homeChances">0</div>
      </div>
    </div>
    <div style="text-align:center;color:#8fe9ad;font-size:11px;font-weight:800;margin:-5px 0 14px">● ONLINE • GOOGLE SHEETS</div>
    <div class="home-actions">
      <button class="ui-btn" id="startGameBtn" type="button">MULAI BERMAIN</button>
      <button class="ui-btn secondary" id="homeLogoutBtn" type="button">LOGOUT</button>
    </div>
  </div>
</div>

<main class="scene" id="scene" style="display:none">

  <div class="game-hud" id="gameHud">
    <div class="hud-box">
      <div class="hud-id">ID <b id="hudMemberId">-</b></div>
      <div class="hud-chance">Kesempatan <b id="hudChances">0</b></div>
    </div>
    <div class="hud-actions">
      <button class="hud-btn" id="backMenuBtn" type="button">MENU</button>
      <button class="hud-btn" id="gameLogoutBtn" type="button">LOGOUT</button>
    </div>
  </div>

  <section class="stage" id="stage">
    <div class="cauldron-zone">
      <div class="cauldron-shadow"></div>
      <img src="assets/cauldron.png" class="cauldron-img" alt="Kuali sihir" draggable="false">
      <div class="liquid-glow"></div>
      <div class="liquid-mask"><div class="liquid-surface"></div></div>
      <div class="magic-ring"></div>
      <span class="pour-target" id="pourTarget" aria-hidden="true"></span>
      <div id="bubbles"></div>
      <div id="smoke"></div>
      <div class="flash" id="flash"></div>
    </div>

    <svg class="pour-svg" id="pourSvg" aria-hidden="true">
      <defs>
        <linearGradient id="potionGradient" gradientUnits="userSpaceOnUse">
          <stop offset="0%" style="stop-color:var(--c1,#f6d0ff)"/>
          <stop offset="45%" style="stop-color:var(--c2,#cf55ff)"/>
          <stop offset="100%" style="stop-color:var(--c3,#8a1dcc)"/>
        </linearGradient>
      </defs>
      <path class="pour-glow" id="pourGlow"></path>
      <path class="pour-main" id="pourMain"></path>
      <path class="pour-highlight" id="pourHighlight"></path>
      <ellipse class="pour-splash" id="pourSplash" rx="22" ry="7"></ellipse>
    </svg>

    <div class="bottles">
      <button class="bottle purple" type="button" aria-label="Ramuan ungu" data-c1="#f4c5ff" data-c2="#d052ff" data-c3="#8617cc" data-glow="rgba(220,98,255,.78)">
        <img class="closed" src="assets/potion-purple-closed.png" alt="Ramuan ungu tertutup">
        <img class="open" src="assets/potion-purple-open.png" alt="Ramuan ungu terbuka">
        <span class="pour-mouth" aria-hidden="true"></span>
      </button>
      <button class="bottle green" type="button" aria-label="Ramuan hijau" data-c1="#e1ffd6" data-c2="#73ff72" data-c3="#169747" data-glow="rgba(116,255,126,.76)">
        <img class="closed" src="assets/potion-green-closed.png" alt="Ramuan hijau tertutup">
        <img class="open" src="assets/potion-green-open.png" alt="Ramuan hijau terbuka">
        <span class="pour-mouth" aria-hidden="true"></span>
      </button>
      <button class="bottle blue" type="button" aria-label="Ramuan biru" data-c1="#dffaff" data-c2="#56c8ff" data-c3="#056eea" data-glow="rgba(104,201,255,.78)">
        <img class="closed" src="assets/potion-blue-closed.png" alt="Ramuan biru tertutup">
        <img class="open" src="assets/potion-blue-open.png" alt="Ramuan biru terbuka">
        <span class="pour-mouth" aria-hidden="true"></span>
      </button>
    </div>
  </section>
</main>

<div class="result-layer" id="resultLayer">
  <div class="ui-card result-card">
    <div class="reward-reveal" id="rewardReveal">
      <div class="reveal-glow"></div>
      <div class="reveal-smoke" id="revealSmoke"></div>
      <div class="prize-emerge" id="prizeEmerge">
        <div class="prize-badge" id="prizeBadgeIcon">✨</div>
        <div class="prize-reveal-name" id="prizeRevealName">-</div>
        <div class="prize-reveal-value" id="prizeRevealValue"></div>
      </div>
    </div>
    <div class="result-icon">✨</div>
    <div class="result-kicker">HASIL RAMUAN</div>
    <div class="result-name" id="resultName">-</div>
    <div class="result-value" id="resultValue"></div>
    <div class="result-remaining">Sisa kesempatan: <b id="resultRemaining">0</b></div>
    <div class="result-actions">
      <button class="ui-btn" id="playAgainBtn" type="button">MAIN LAGI</button>
      <button class="ui-btn secondary" id="resultMenuBtn" type="button">KEMBALI KE MENU</button>
    </div>
  </div>
</div>

<script>
(()=>{
  "use strict";

  const scene = document.getElementById("scene");
  const bottles = [...document.querySelectorAll(".bottle")];
  const bubbles = document.getElementById("bubbles");
  const smoke = document.getElementById("smoke");
  const pourSvg = document.getElementById("pourSvg");
  const pourGlow = document.getElementById("pourGlow");
  const pourMain = document.getElementById("pourMain");
  const pourHighlight = document.getElementById("pourHighlight");
  const pourSplash = document.getElementById("pourSplash");
  const flash = document.getElementById("flash");
  const stage = document.getElementById("stage");
  const pourTarget = document.getElementById("pourTarget");

  /* =========================================================
     ONLINE DATABASE - GOOGLE SHEETS + APPS SCRIPT
     Paste URL Web App /exec di bawah.
     ========================================================= */
  const API_URL = "https://script.google.com/macros/s/AKfycbyQ1ylop_C9iunOcqylHVcgDzNoabzw-QZBkB8K9b6F2wIb5Oaa-xqZdh4UzEDxZhwvkg/exec";
  const SESSION_KEY = "magicCauldronMemberToken_sheet_v1";

  const authLayer = document.getElementById("authLayer");
  const homeLayer = document.getElementById("homeLayer");
  const memberLoginForm = document.getElementById("memberLoginForm");
  const loginUserId = document.getElementById("loginUserId");
  const loginPassword = document.getElementById("loginPassword");
  const loginError = document.getElementById("loginError");
  const homeMemberId = document.getElementById("homeMemberId");
  const homeChances = document.getElementById("homeChances");
  const startGameBtn = document.getElementById("startGameBtn");
  const homeLogoutBtn = document.getElementById("homeLogoutBtn");
  const gameLogoutBtn = document.getElementById("gameLogoutBtn");
  const backMenuBtn = document.getElementById("backMenuBtn");
  const gameHud = document.getElementById("gameHud");
  const hudMemberId = document.getElementById("hudMemberId");
  const hudChances = document.getElementById("hudChances");
  const resultLayer = document.getElementById("resultLayer");
  const revealSmoke = document.getElementById("revealSmoke");
  const prizeBadgeIcon = document.getElementById("prizeBadgeIcon");
  const prizeRevealName = document.getElementById("prizeRevealName");
  const prizeRevealValue = document.getElementById("prizeRevealValue");
  const resultName = document.getElementById("resultName");
  const resultValue = document.getElementById("resultValue");
  const resultRemaining = document.getElementById("resultRemaining");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const resultMenuBtn = document.getElementById("resultMenuBtn");

  let memberToken = sessionStorage.getItem(SESSION_KEY) || "";
  let currentMember = null;

  function apiConfigured(){
    return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(API_URL);
  }

  function friendlyError(err){
    const raw = String(err?.message || err || "");
    const map = [
      ["LOGIN_INVALID","User ID atau password salah."],
      ["MEMBER_SESSION_INVALID","Sesi login berakhir. Silakan login kembali."],
      ["MEMBER_INACTIVE","Akun sedang dinonaktifkan admin."],
      ["MEMBER_NOT_FOUND","Data member tidak ditemukan."],
      ["NO_CHANCES","Kesempatan bermain sudah habis."],
      ["SPREADSHEET_ID_NOT_CONFIGURED","Spreadsheet ID belum diisi pada Code.gs."],
      ["Failed to fetch","Tidak dapat menghubungi server. Cek internet dan URL Apps Script."]
    ];
    for(const [key,msg] of map){
      if(raw.includes(key)) return msg;
    }
    return raw || "Terjadi kesalahan server.";
  }

  async function api(action,payload={}){
    if(!apiConfigured()) throw new Error("API_URL belum dikonfigurasi.");

    const response = await fetch(API_URL,{
      method:"POST",
      redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action,...payload})
    });

    const text = await response.text();
    let result;
    try{ result = JSON.parse(text); }
    catch(e){ throw new Error("Respons API tidak valid. Pastikan URL deployment berakhiran /exec."); }

    if(!result.ok) throw new Error(result.error || "API_ERROR");
    return result.data;
  }

  function clearResultState(){
    resultLayer.classList.remove("show");
    resultLayer.style.display = "none";
    if(revealSmoke) revealSmoke.innerHTML = "";
  }

  function showLogin(){
    scene.style.display = "none";
    gameHud.style.display = "none";
    homeLayer.style.display = "none";
    clearResultState();
    authLayer.style.display = "flex";

    if(!apiConfigured()){
      loginError.textContent = "Isi API_URL Google Apps Script pada HTML.";
    }
  }

  async function refreshMemberUI({silent=false}={}){
    if(!memberToken) return null;
    try{
      currentMember = await api("memberState",{token:memberToken});
      homeMemberId.textContent = currentMember.userId || "-";
      homeChances.textContent = Number(currentMember.chances || 0);
      hudMemberId.textContent = currentMember.userId || "-";
      hudChances.textContent = Number(currentMember.chances || 0);
      startGameBtn.disabled = Number(currentMember.chances || 0) <= 0;
      startGameBtn.textContent = Number(currentMember.chances || 0) > 0 ? "MULAI BERMAIN" : "KESEMPATAN HABIS";
      return currentMember;
    }catch(err){
      if(!silent) console.error(err);
      if(String(err.message).includes("MEMBER_SESSION_INVALID")){
        await logoutMember(false);
      }
      return null;
    }
  }

  async function showHome(){
    const member = await refreshMemberUI();
    if(!member){
      if(!memberToken) showLogin();
      return;
    }
    scene.style.display = "none";
    gameHud.style.display = "none";
    clearResultState();
    authLayer.style.display = "none";
    homeLayer.style.display = "flex";
  }

  async function showGame(){
    const member = await refreshMemberUI();
    if(!member) return;

    if(Number(member.chances || 0) <= 0){
      await showHome();
      return;
    }

    authLayer.style.display = "none";
    homeLayer.style.display = "none";
    clearResultState();
    scene.style.display = "block";
    gameHud.style.display = "flex";
    setTimeout(updateStageScale,20);
  }

  async function logoutMember(callServer=true){
    const oldToken = memberToken;
    memberToken = "";
    currentMember = null;
    sessionStorage.removeItem(SESSION_KEY);

    if(callServer && oldToken && apiConfigured()){
      try{ await api("memberLogout",{token:oldToken}); }catch(e){}
    }

    loginPassword.value = "";
    showLogin();
  }

  async function consumePlay(bottleName){
    const r = await api("play",{token:memberToken,bottle:bottleName});

    if(currentMember){
      currentMember.chances = Number(r.remaining || 0);
      currentMember.totalPlay = Number(r.totalPlay || 0);
      currentMember.lastPrize = r.prizeName || "";
    }

    homeChances.textContent = Number(r.remaining || 0);
    hudChances.textContent = Number(r.remaining || 0);

    return {
      prizeName:r.prizeName || "-",
      prizeValue:r.prizeValue || "",
      remaining:Number(r.remaining || 0),
      forced:!!r.forced
    };
  }

  function getPrizeIcon(play){
    const text = `${play.prizeName || ""} ${play.prizeValue || ""}`.toLowerCase();
    if(text.includes("jackpot")) return "👑";
    if(text.includes("100") || text.includes("50")) return "💎";
    if(text.includes("bonus")) return "🎁";
    return "✨";
  }

  function spawnRevealSmoke(){
    if(!revealSmoke) return;
    revealSmoke.innerHTML = "";
    for(let i=0;i<18;i++){
      const puff = document.createElement("span");
      puff.className = "reveal-puff";
      puff.style.setProperty("--size", `${60 + Math.random()*82}px`);
      puff.style.setProperty("--blur", `${10 + Math.random()*10}px`);
      puff.style.setProperty("--dur", `${1.15 + Math.random()*.55}s`);
      puff.style.setProperty("--o", `${.42 + Math.random()*.28}`);
      puff.style.setProperty("--o2", `${.26 + Math.random()*.18}`);
      puff.style.setProperty("--o3", `${.12 + Math.random()*.12}`);
      puff.style.setProperty("--drift1", `${-26 + Math.random()*52}px`);
      puff.style.setProperty("--drift2", `${-58 + Math.random()*116}px`);
      puff.style.setProperty("--drift3", `${-86 + Math.random()*172}px`);
      puff.style.setProperty("--drift4", `${-120 + Math.random()*240}px`);
      puff.style.setProperty("--rise", `${-118 - Math.random()*54}px`);
      puff.style.setProperty("--scale", `${1.34 + Math.random()*.82}`);
      puff.style.animationDelay = `${Math.random()*.22}s`;
      revealSmoke.appendChild(puff);
    }
  }

  function showResult(play){
    const icon = getPrizeIcon(play);
    prizeBadgeIcon.textContent = icon;
    prizeRevealName.textContent = play.prizeName || "-";
    prizeRevealValue.textContent = play.prizeValue || "";
    resultName.textContent = play.prizeName || "-";
    resultValue.textContent = play.prizeValue || "";
    resultRemaining.textContent = play.remaining;
    playAgainBtn.style.display = Number(play.remaining) > 0 ? "block" : "none";

    clearResultState();
    spawnRevealSmoke();
    resultLayer.style.display = "flex";
    void resultLayer.offsetWidth;
    requestAnimationFrame(()=>resultLayer.classList.add("show"));
  }

  memberLoginForm.addEventListener("submit",async e=>{
    e.preventDefault();
    loginError.textContent = "";

    if(!apiConfigured()){
      loginError.textContent = "Isi API_URL Google Apps Script terlebih dahulu.";
      return;
    }

    const btn = memberLoginForm.querySelector('button[type="submit"]');
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "MENGHUBUNGKAN...";

    try{
      const r = await api("memberLogin",{
        userId:loginUserId.value.trim(),
        password:loginPassword.value
      });

      memberToken = r.token;
      currentMember = r.member;
      sessionStorage.setItem(SESSION_KEY,memberToken);
      loginPassword.value = "";
      await showHome();
    }catch(err){
      loginError.textContent = friendlyError(err);
    }finally{
      btn.disabled = false;
      btn.textContent = old;
    }
  });

  startGameBtn.addEventListener("click",()=>showGame());
  homeLogoutBtn.addEventListener("click",()=>logoutMember());
  gameLogoutBtn.addEventListener("click",()=>logoutMember());
  backMenuBtn.addEventListener("click",()=>{if(!busy) showHome();});
  resultMenuBtn.addEventListener("click",()=>showHome());
  playAgainBtn.addEventListener("click",()=>{clearResultState();showGame();});

  setInterval(async()=>{
    if(!memberToken || busy || document.hidden) return;
    const m = await refreshMemberUI({silent:true});
    if(!m) return;
    if(Number(m.chances || 0) <= 0 && scene.style.display !== "none" && resultLayer.style.display !== "flex"){
      await showHome();
    }
  },3000);



  let busy = false;
  let bubbleTimer;
  let smokeTimer;
  let streamRAF = 0;
  let pourStartTime = 0;

  const random = (min,max) => Math.random() * (max-min) + min;

  function makeBubble(big=false){
    if(document.hidden) return;
    const b = document.createElement("span");
    b.className = "bubble";
    const size = random(big ? 11 : 5, big ? 26 : 14);
    b.style.width = `${size}px`;
    b.style.height = `${size * random(.72,1)}px`;
    b.style.left = `${random(10,90)}%`;
    b.style.setProperty("--duration", `${random(big ? .72 : 1.0, big ? 1.2 : 1.7)}s`);
    b.style.setProperty("--drift1", `${random(-18,18)}px`);
    b.style.setProperty("--drift2", `${random(-30,30)}px`);
    bubbles.appendChild(b);
    b.addEventListener("animationend",()=>b.remove(),{once:true});
  }

  function makeSmoke(big=false){
    if(document.hidden) return;

    const s = document.createElement("span");
    s.className = "smoke-particle";

    const size = random(big ? 120 : 92, big ? 220 : 165);

    s.style.left = `${random(26,74)}%`;
    s.style.setProperty("--size", `${size}px`);
    s.style.setProperty("--blur", `${random(16,28)}px`);
    s.style.setProperty("--duration", `${random(big ? 2.4 : 3.2, big ? 4.0 : 5.0)}s`);

    /* asap normal tebal, saat menuang jauh lebih tebal */
    s.style.setProperty("--opacity", big ? random(.70,.90) : random(.42,.58));
    s.style.setProperty("--opacity-mid", big ? random(.48,.66) : random(.28,.40));
    s.style.setProperty("--opacity-low", big ? random(.22,.34) : random(.14,.22));

    s.style.setProperty("--drift1", `${random(-32,32)}px`);
    s.style.setProperty("--drift2", `${random(-68,68)}px`);
    s.style.setProperty("--drift3", `${random(-110,110)}px`);
    s.style.setProperty("--rise", `${random(-190,-125)}px`);
    s.style.setProperty("--scale", random(1.7,2.45));

    smoke.appendChild(s);
    s.addEventListener("animationend",()=>s.remove(),{once:true});
  }

  function restartAnimation(element,className){
    element.classList.remove(className);
    void element.offsetWidth;
    element.classList.add(className);
  }

  function burst(){
    for(let i=0;i<14;i++){
      setTimeout(()=>makeBubble(true), i*38);
    }

    /* asap utama saat ramuan dituangkan */
    for(let i=0;i<18;i++){
      setTimeout(()=>makeSmoke(true), i*44);
    }

    /* asap susulan agar terlihat padat dan menyebar */
    for(let i=0;i<8;i++){
      setTimeout(()=>makeSmoke(true), 420 + (i*52));
    }
  }

  function setPotionColors(button){
    scene.style.setProperty("--c1", button.dataset.c1);
    scene.style.setProperty("--c2", button.dataset.c2);
    scene.style.setProperty("--c3", button.dataset.c3);
    scene.style.setProperty("--glow", button.dataset.glow);
  }


  function updatePourGeometry(button){
    const mouth = button.querySelector(".pour-mouth");
    if(!mouth || !pourTarget || !stage || !pourSvg) return;

    const stageRect = stage.getBoundingClientRect();
    const mouthRect = mouth.getBoundingClientRect();
    const targetRect = pourTarget.getBoundingClientRect();

    const scaleX = stageRect.width / stage.offsetWidth || 1;
    const scaleY = stageRect.height / stage.offsetHeight || 1;

    const sx = ((mouthRect.left + mouthRect.width / 2) - stageRect.left) / scaleX;
    const sy = ((mouthRect.top + mouthRect.height / 2) - stageRect.top) / scaleY;
    const tx = ((targetRect.left + targetRect.width / 2) - stageRect.left) / scaleX;
    const ty = ((targetRect.top + targetRect.height / 2) - stageRect.top) / scaleY;

    pourSvg.setAttribute("viewBox", `0 0 ${stage.offsetWidth} ${stage.offsetHeight}`);

    const dx = tx - sx;
    const dy = ty - sy;
    const dir = Math.sign(dx || 1);

    /*
      Aliran dibuat lebih natural:
      1. keluar sedikit dari mulut botol,
      2. lalu jatuh karena gravitasi,
      3. hanya 1 cubic Bézier supaya tidak melengkung seperti huruf S.
    */
    const horizontalLead = Math.min(18, Math.max(8, Math.abs(dx) * 0.075));
    const fallLead = Math.min(8, Math.max(3, Math.abs(dy) * 0.025));

    const c1x = sx + dir * horizontalLead;
    const c1y = sy + fallLead;

    const targetApproach = Math.min(18, Math.max(8, Math.abs(dx) * 0.06));
    const gravityHeight = Math.min(58, Math.max(32, Math.abs(dy) * 0.22));

    const c2x = tx - dir * targetApproach;
    const c2y = ty - gravityHeight;

    const d = `M ${sx.toFixed(2)} ${sy.toFixed(2)} C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${tx.toFixed(2)} ${ty.toFixed(2)}`;

    pourGlow.setAttribute("d", d);
    pourMain.setAttribute("d", d);
    pourHighlight.setAttribute("d", d);

    pourSplash.setAttribute("cx", tx.toFixed(2));
    pourSplash.setAttribute("cy", ty.toFixed(2));

    const gradient = document.getElementById("potionGradient");
    if(gradient){
      gradient.setAttribute("x1", sx.toFixed(2));
      gradient.setAttribute("y1", sy.toFixed(2));
      gradient.setAttribute("x2", tx.toFixed(2));
      gradient.setAttribute("y2", ty.toFixed(2));
    }
  }

  function followPour(button){
    cancelAnimationFrame(streamRAF);

    const tick = ()=>{
      if(!button.classList.contains("active") || !pourSvg.classList.contains("show")){
        cancelAnimationFrame(streamRAF);
        streamRAF = 0;
        return;
      }

      updatePourGeometry(button);
      streamRAF = requestAnimationFrame(tick);
    };

    tick();
  }

  async function activateBottle(button){
    if(busy || !memberToken) return;

    const bottleName =
      button.classList.contains("purple") ? "UNGU" :
      button.classList.contains("green") ? "HIJAU" :
      button.classList.contains("blue") ? "BIRU" : "RAMUAN";

    busy = true;
    bottles.forEach(b=>b.disabled=true);

    let play;
    try{
      play = await consumePlay(bottleName);
    }catch(err){
      busy = false;
      bottles.forEach(b=>b.disabled=false);

      const msg = friendlyError(err);
      if(String(err.message).includes("MEMBER_SESSION_INVALID")){
        await logoutMember(false);
      }else if(String(err.message).includes("NO_CHANCES")){
        alert(msg);
        await showHome();
      }else{
        alert(msg);
      }
      return;
    }

    setPotionColors(button);
    button.classList.add("active");

    setTimeout(()=>{
      pourStartTime = performance.now();
      updatePourGeometry(button);
      pourSvg.classList.add("show");
      followPour(button);
      restartAnimation(flash,"show");
      burst();
    },1340);

    setTimeout(()=>{
      pourSvg.classList.remove("show");
      cancelAnimationFrame(streamRAF);
      streamRAF = 0;
    },1980);

    setTimeout(()=>{
      button.classList.remove("active");
      flash.classList.remove("show");
      bottles.forEach(b=>b.disabled=false);
      busy = false;
      showResult(play);
    },2860);
  }

  bottles.forEach(button=>{
    button.addEventListener("click", ()=>activateBottle(button));
  });

  function startAmbient(){
    clearInterval(bubbleTimer);
    clearInterval(smokeTimer);

    bubbleTimer = setInterval(()=>makeBubble(false), 320);

    /* asap idle lebih sering agar tidak terlihat tipis */
    smokeTimer = setInterval(()=>{
      if(Math.random() > .08) makeSmoke(false);
    }, 300);
  }

  startAmbient();
  for(let i=0;i<7;i++){
    setTimeout(()=>makeBubble(false), i*120);
    if(i<6) setTimeout(()=>makeSmoke(false), i*130);
  }

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
      clearInterval(bubbleTimer);
      clearInterval(smokeTimer);
      cancelAnimationFrame(streamRAF);
      streamRAF = 0;
    }else{
      startAmbient();
      updateStageScale();
    }
  });

  function updateStageScale(){
    if(!stage || !scene) return;

    const stageWidth = stage.offsetWidth || 920;
    const stageHeight = stage.offsetHeight || 720;
    const availableWidth = Math.max(320, scene.clientWidth - 24);
    const availableHeight = Math.max(320, scene.clientHeight - 16);

    const widthScale = availableWidth / stageWidth;
    const heightScale = availableHeight / stageHeight;

    const scale = Math.max(.44, Math.min(widthScale, heightScale, 1.08));
    stage.style.transform = `translateX(-50%) scale(${scale})`;
  }

  window.addEventListener("resize", updateStageScale);
  window.addEventListener("orientationchange", updateStageScale);
  updateStageScale();

  /* Initial screen - Google Sheets online */
  if(memberToken){ showHome(); } else { showLogin(); }

/* Block browser zoom */
  window.addEventListener("wheel", (e)=>{ if(e.ctrlKey) e.preventDefault(); }, {passive:false});
  document.addEventListener("keydown", (e)=>{
    if((e.ctrlKey || e.metaKey) && ["+","-","=","0"].includes(e.key)) e.preventDefault();
  });
  document.addEventListener("gesturestart", e=>e.preventDefault());
  document.addEventListener("gesturechange", e=>e.preventDefault());
  document.addEventListener("gestureend", e=>e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e)=>{
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});
})();
</script>
</body>
</html>
